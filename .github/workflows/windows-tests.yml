name: Windows test suite

# Three tiers, chosen from what actually changed by `scripts/ci/windows-test-plan.sh`.
#
#   none      nothing to prove on Windows (docs, website, Android). The job still runs and reports
#             success in about a minute, because a check that never reports is indistinguishable from a
#             check that was skipped — and it would block a PR the day branch protection is added.
#   runtime   Rust changed: compile every Windows test target, then run the fast runtime suites for the
#             areas that changed. This is the tier that keeps critical modules exercised per commit
#             without the 120–140 minute serial suite.
#   full      the complete serial suite. Only on purpose: `workflow_dispatch` with full_suite=true,
#             which is the pre-release / LIVE gate. Deliberately no schedule — a nightly 2½-hour run on
#             a repo with no branch protection buys nothing the gate does not.
#
# The selection is a separate, pure script so it can be read and tested against any change set without
# running CI. What it must never do is select nothing for a change that needs tests: every directive is
# asserted below to match at least one test, so a filter that stops matching anything fails the job
# instead of passing it quietly.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the complete serial Windows suite (the ~2h20 release gate). Leave false for the tiered run."
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only the Windows job ever compiled test targets, so drift in tests/** or in
  # #[cfg(test)] code stayed invisible until a 20-minute Windows compile — which
  # is exactly how a one-line missing struct field kept this suite red from
  # 2026-10-31 to 2026-11-05. `check` is enough to catch structural drift and
  # costs a couple of minutes on a warm cache.
  check-all-targets:
    name: Linux check (all targets)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ultranet-linux-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ultranet-linux-check-

      - name: Check that every target compiles
        shell: bash
        run: cargo check --locked --all-targets

  test-windows:
    name: Windows x64 Rust tests
    runs-on: windows-2022
    # 200, not 180: the full serial suite measures 120–140 minutes on this runner (five of the last six
    # green runs), so a lower ceiling puts one slow day between a passing suite and a job that dies at
    # the limit and reads as a red suite. The full-suite step keeps its own 170-minute bound below.
    timeout-minutes: 200
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "120"
      GIT_TERMINAL_PROMPT: "0"
      RUST_BACKTRACE: "1"
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: "-C link-arg=-Wl,--exclude-all-symbols"
    steps:
      # Full history, so the scope step can diff this run against its real base. The repository is
      # small; a shallow clone would make "what changed" a guess.
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # What changed, before anything may read it as "nothing changed". The range is resolved, validated
      # and diffed by its own script so every way it can fail is testable outside CI; here the only thing
      # to know is that this step failing fails the run, which is the point. An infrastructure or git
      # error must never be inherited by the planner as an empty change set, because an empty change set
      # is the legitimate input for MODE=none — a green job that ran no tests.
      - name: Work out which files changed
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full_suite }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          range="$(bash scripts/ci/resolve-changed-files.sh)"
          echo "  $range"
          {
            echo "### Comparison range"
            echo
            echo '```'
            echo "$range"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The one decision every later step depends on. It is a step rather than a job-level `if:`
      # because a skipped job is a check with no conclusion, and this job's conclusion is the thing a
      # reviewer (or a future branch protection rule) reads.
      - name: Decide what this run must prove
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full_suite }}
        run: |
          set -euo pipefail
          # The plan is computed by a separate, pure script so it can be read and tested on its own.
          EVENT="$EVENT" FULL_INPUT="${FULL_INPUT:-false}" \
            bash scripts/ci/windows-test-plan.sh < changed-files.txt > windows-test-plan.txt

          mode=$(sed -n 's/^MODE=//p' windows-test-plan.txt)
          adapter=$(sed -n 's/^ADAPTER=//p' windows-test-plan.txt)
          compile_all=$(sed -n 's/^COMPILE_ALL=//p' windows-test-plan.txt)
          directives=$(grep -c '^TEST ' windows-test-plan.txt || true)
          files=$(grep -c . changed-files.txt || true)

          # A plan without one of the three modes means the planner did not finish. Reading that as
          # `none` would be the same failure this job exists to prevent, so it stops the run instead.
          case "$mode" in
            none|runtime|full) ;;
            *)
              echo "::error title=Windows test selection::the plan carries no usable MODE ('${mode}')"
              exit 1
              ;;
          esac

          # A runtime tier with nothing to run is a selection bug, not a reason to pass.
          if [ "$mode" = "runtime" ] && [ "$directives" -eq 0 ]; then
            echo "::error title=Windows test selection::mode=runtime but the plan contains no tests"
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "adapter=$adapter" >> "$GITHUB_OUTPUT"
          echo "compile_all=$compile_all" >> "$GITHUB_OUTPUT"
          echo "::notice title=Windows test scope::$mode — $directives test command(s)"
          {
            echo "### Windows test scope: \`$mode\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| mode | \`$mode\` |"
            echo "| adapter/module changed | \`$adapter\` |"
            echo "| changed files | ${files:-0} |"
            echo "| test commands | ${directives:-0} |"
            echo
            if [ "$mode" = "runtime" ]; then
              echo "Exact commands this run will execute:"
              echo
              grep '^TEST ' windows-test-plan.txt | sed 's/^TEST LIB /lib    /; s/^TEST BIN /binary /' | sed 's/^/    /'
            elif [ "$mode" = "full" ]; then
              echo "The complete serial suite runs; the tiered selection is not used."
            else
              echo "No Rust source changed, so no Windows toolchain and no tests were run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything below that costs minutes is gated on the scope. `none` finishes in about a minute:
      # checkout, the decision, and an honest summary saying nothing ran and why.
      # No `update: true`: a full MSYS2 package upgrade on a fresh runner every run was both the
      # slowest part of this step and the cause of a run that failed after 46 seconds with the suite
      # never starting. The packages below are what this build actually needs.
      - name: Install MinGW toolchain
        if: steps.scope.outputs.mode != 'none'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-llvm-libs
            mingw-w64-x86_64-cmake

      - name: Locate LLVM for bindgen
        if: steps.scope.outputs.mode != 'none'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The windows-2022 image already ships LLVM. Downloading it again on every run costs network
          # time and pins nothing; use the image's copy, and fall back to a pinned install only when
          # the image has none, so the fallback is a deliberate, reproducible choice rather than a race
          # against whatever Chocolatey publishes that day.
          $candidates = @("C:\Program Files\LLVM\bin", "C:\Program Files (x86)\LLVM\bin")
          $llvmPath = $candidates | Where-Object { Test-Path "$_\libclang.dll" } | Select-Object -First 1
          if (-not $llvmPath) {
            choco install llvm --version=18.1.8 -y --no-progress
            $llvmPath = "C:\Program Files\LLVM\bin"
          }
          if (!(Test-Path "$llvmPath\libclang.dll")) {
            throw "libclang.dll not found: LLVM is absent from the image and the pinned fallback did not install it"
          }
          "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        if: steps.scope.outputs.mode != 'none'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-gnu

      # The registry alone left `target/` cold, so every run rebuilt the whole graph — PQClean's C
      # sources through bindgen included — on two cores before a single test binary existed. Skipped
      # when nothing will be built, because the restore alone costs minutes.
      - name: Restore Cargo dependency and build cache
        if: steps.scope.outputs.mode != 'none'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ultranet-windows-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ultranet-windows-tests-
            ultranet-cargo-

      - name: Verify Windows test toolchain
        if: steps.scope.outputs.mode != 'none'
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -euo pipefail
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          cargo --version
          rustc --version
          clang --version

      # Compile first, once. Every test target must build on Windows before any test runs, so a
      # structural break fails here, cheaply and clearly, rather than as a mysterious later error.
      - name: Compile every Windows test target
        if: steps.scope.outputs.compile_all == '1'
        timeout-minutes: 60
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -o pipefail
          cargo test --target x86_64-pc-windows-gnu --locked --all-targets --no-run 2>&1 | tee windows-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Windows tests::A Windows test target does not compile"
            exit "$status"
          fi

      # The middle tier: the fast runtime suites for the areas that changed, run serially because this
      # runner has two vCPUs and concurrency here has produced sled allocation panics and start-up races.
      # Each directive must actually execute at least one test. A filter that matches nothing is a
      # selection bug — it would otherwise exit 0 and report a green job that tested nothing.
      - name: Run the selected Windows runtime tests
        if: steps.scope.outputs.mode == 'runtime'
        timeout-minutes: 60
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -uo pipefail
          executed=0
          while IFS= read -r line; do
            case "$line" in
              'TEST LIB '*) kind=LIB; sel=${line#TEST LIB } ;;
              'TEST BIN '*) kind=BIN; sel=${line#TEST BIN } ;;
              *) continue ;;
            esac

            tmp="$(mktemp)"
            if [ "$kind" = "LIB" ]; then
              cargo test --target x86_64-pc-windows-gnu --locked --lib -- "$sel" --test-threads=1 >"$tmp" 2>&1
            else
              cargo test --target x86_64-pc-windows-gnu --locked --test "$sel" -- --test-threads=1 >"$tmp" 2>&1
            fi
            status=$?
            cat "$tmp" | tee -a windows-test.log >/dev/null

            passed=$(grep -oE '[0-9]+ passed' "$tmp" | tail -1 | grep -oE '[0-9]+' || true)
            failed=$(grep -oE '[0-9]+ failed' "$tmp" | tail -1 | grep -oE '[0-9]+' || true)
            if [ "$status" -ne 0 ]; then
              echo "::error title=Windows tests::${kind} ${sel} failed (${passed:-0} passed, ${failed:-?} failed)"
              rm -f "$tmp"
              exit "$status"
            fi
            if [ "${passed:-0}" -lt 1 ]; then
              echo "::error title=Windows test selection::${kind} ${sel} matched zero tests — the selection is stale or the tests were renamed"
              rm -f "$tmp"
              exit 1
            fi
            echo "  ${kind} ${sel}: ${passed} passed, ${failed:-0} failed"
            executed=$((executed + 1))
            rm -f "$tmp"
          done < windows-test-plan.txt

          echo "  directives executed: $executed"
          if [ "$executed" -eq 0 ]; then
            echo "::error title=Windows test selection::no test directive ran"
            exit 1
          fi

      # Serial on purpose. Two failures on this runner were concurrency, not logic: sled panicked with
      # "failed to allocate Arc" while several stores were open at once, and a loopback request lost a
      # start-up race. The runner has two vCPUs and a thin memory margin, so a flaky check costs more
      # than a slow one.
      # Bounded so a hang fails naming this step instead of the job dying at the 200-minute limit.
      # Unchanged command, unchanged selection, unchanged coverage — only the trigger is now explicit.
      - name: Run complete Windows test suite serially
        if: steps.scope.outputs.mode == 'full'
        # 170, not 150. Still bounded, so a genuine hang fails naming this step rather than the job; the
        # margin over the measured 120–140 minutes is now large enough that variance cannot fake a red.
        timeout-minutes: 170
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -o pipefail
          cargo test --target x86_64-pc-windows-gnu --locked --all-targets -- --test-threads=1 2>&1 | tee windows-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Windows tests::The complete Windows all-targets suite failed"
            exit "$status"
          fi

      # Always, not only on failure. A green run is exactly when the suite's own summary is worth
      # keeping — it is the only place the test counts and warnings can be read back later, since the
      # logs expire in the UI. `warn` matters as much as `always`: setup can fail before the log exists,
      # and a missing log must never be able to turn a meaningful failure into a green job, nor turn an
      # unrelated missing file into a second failure. The steps above are still what decide the verdict;
      # this step only records.
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ultranet-windows-test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-test.log
          if-no-files-found: warn
          retention-days: 14
