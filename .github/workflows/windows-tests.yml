name: Windows test suite

# Tiered on purpose. The complete serial all-targets suite costs 120–140 minutes of this runner for a
# property that almost never changes, so paying it on every commit is a tax on every unrelated change.
# This file runs three scopes instead, chosen from what actually changed:
#
#   none      nothing to prove on Windows (docs, website, Android). The job still runs and reports
#             success in about a minute, because a check that never reports is indistinguishable from
#             a check that was skipped — and it would block a PR the day branch protection is added.
#   targeted  Rust changed: compile every Windows test target, and run the adapter validator and the
#             shipped-verifier tests when the change touches the wasm module. This catches exactly the
#             failure mode that kept this suite red for six days in 2026-10: a test target that stopped
#             compiling on Windows.
#   full      the complete serial suite. Only on purpose: `workflow_dispatch` with full_suite=true,
#             which is the pre-release / LIVE gate. Deliberately no schedule — a nightly 2½-hour run on
#             a repo with no branch protection buys nothing that the gate does not.
#
# The full suite's command, its 170-minute bound, and the always-uploaded log are unchanged. Only the
# condition on which they run is new.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_suite:
        description: "Run the complete serial Windows suite (the ~2h20 release gate). Leave false for the fast check."
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only the Windows job ever compiled test targets, so drift in tests/** or in
  # #[cfg(test)] code stayed invisible until a 20-minute Windows compile — which
  # is exactly how a one-line missing struct field kept this suite red from
  # 2026-10-31 to 2026-11-05. `check` is enough to catch structural drift and
  # costs a couple of minutes on a warm cache.
  check-all-targets:
    name: Linux check (all targets)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ultranet-linux-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ultranet-linux-check-

      - name: Check that every target compiles
        shell: bash
        run: cargo check --locked --all-targets

  test-windows:
    name: Windows x64 Rust tests
    runs-on: windows-2022
    # 200, not 180: the full serial suite measures 120–140 minutes on this runner (five of the last six
    # green runs), so a lower ceiling puts one slow day between a passing suite and a job that dies at
    # the limit and reads as a red suite. The full-suite step keeps its own 170-minute bound below.
    timeout-minutes: 200
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "120"
      GIT_TERMINAL_PROMPT: "0"
      RUST_BACKTRACE: "1"
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: "-C link-arg=-Wl,--exclude-all-symbols"
    steps:
      # Full history, so the scope step can diff this run against its real base. The repository is
      # small; a shallow clone would make "what changed" a guess.
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The one decision every later step depends on. It is a step rather than a job-level `if:`
      # because a skipped job is a check with no conclusion, and this job's conclusion is the thing a
      # reviewer (or a future branch protection rule) reads.
      - name: Decide what this run must prove
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full_suite }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            # A brand-new branch reports an all-zero `before`; compare against its first parent instead.
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA" 2>/dev/null || true)"

          rust=0
          adapter=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              src/*|tests/*|adapters/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*) rust=1 ;;
            esac
            case "$f" in
              adapters/*|scripts/*|src/ultragrid/*|src/games/adapters*) adapter=1 ;;
            esac
          done <<<"$changed"

          if [ "$EVENT" = "workflow_dispatch" ] && [ "${FULL_INPUT:-}" = "true" ]; then
            mode=full
            reason="workflow_dispatch asked for the complete suite"
          elif [ "$rust" = "1" ]; then
            mode=targeted
            reason="Rust source changed"
          else
            mode=none
            reason="no Rust source changed"
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "adapter=$adapter" >> "$GITHUB_OUTPUT"
          echo "::notice title=Windows test scope::$mode — $reason"
          {
            echo "### Windows test scope: \`$mode\`"
            echo
            echo "$reason."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| mode | \`$mode\` |"
            echo "| Rust changed | $rust |"
            echo "| adapter/module changed | $adapter |"
            echo "| changed files | $(printf '%s' "$changed" | grep -c . || true) |"
            [ "$mode" = "full" ] || echo "| full suite | not run — dispatch with full_suite=true, or the release gate |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Everything below that costs minutes is gated on the scope. `none` finishes in about a minute:
      # checkout, the decision, and an honest summary saying the suite did not run and why.
      # No `update: true`: a full MSYS2 package upgrade on a fresh runner every run was both the
      # slowest part of this step and the cause of a run that failed after 46 seconds with the suite
      # never starting. The packages below are what this build actually needs.
      - name: Install MinGW toolchain
        if: steps.scope.outputs.mode != 'none'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-llvm-libs
            mingw-w64-x86_64-cmake

      - name: Locate LLVM for bindgen
        if: steps.scope.outputs.mode != 'none'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The windows-2022 image already ships LLVM. Downloading it again on every run costs network
          # time and pins nothing; use the image's copy, and fall back to a pinned install only when
          # the image has none, so the fallback is a deliberate, reproducible choice rather than a race
          # against whatever Chocolatey publishes that day.
          $candidates = @("C:\Program Files\LLVM\bin", "C:\Program Files (x86)\LLVM\bin")
          $llvmPath = $candidates | Where-Object { Test-Path "$_\libclang.dll" } | Select-Object -First 1
          if (-not $llvmPath) {
            choco install llvm --version=18.1.8 -y --no-progress
            $llvmPath = "C:\Program Files\LLVM\bin"
          }
          if (!(Test-Path "$llvmPath\libclang.dll")) {
            throw "libclang.dll not found: LLVM is absent from the image and the pinned fallback did not install it"
          }
          "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        if: steps.scope.outputs.mode != 'none'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-gnu

      # The registry alone left `target/` cold, so every run rebuilt the whole graph — PQClean's C
      # sources through bindgen included — on two cores before a single test binary existed. Skipped
      # when nothing will be built, because the restore alone costs minutes.
      - name: Restore Cargo dependency and build cache
        if: steps.scope.outputs.mode != 'none'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ultranet-windows-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ultranet-windows-tests-
            ultranet-cargo-

      - name: Verify Windows test toolchain
        if: steps.scope.outputs.mode != 'none'
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -euo pipefail
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          cargo --version
          rustc --version
          clang --version

      # The ordinary case: prove the Windows build and every test target still compile, then run the
      # two fast suites that cover the wasm module when the change touched it. Serial, like the full
      # suite, for the same reason: this runner has two vCPUs and concurrency here has produced sled
      # allocation panics and start-up races.
      - name: Run targeted Windows tests
        if: steps.scope.outputs.mode == 'targeted'
        timeout-minutes: 60
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -o pipefail
          {
            echo "== every Windows test target must compile =="
            cargo test --target x86_64-pc-windows-gnu --locked --all-targets --no-run
            if [ "${{ steps.scope.outputs.adapter }}" = "1" ]; then
              echo "== adapter validator, bulk memory and fuel metering =="
              cargo test --target x86_64-pc-windows-gnu --locked --lib -- games::adapter::tests --test-threads=1
              echo "== the shipped verifier the runtime has to accept =="
              cargo test --target x86_64-pc-windows-gnu --locked --lib -- shipped_grid_verifier --test-threads=1
            fi
          } 2>&1 | tee windows-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Windows tests::The targeted Windows check failed"
            exit "$status"
          fi

      # Serial on purpose. Two failures on this runner were concurrency, not logic: sled panicked with
      # "failed to allocate Arc" while several stores were open at once, and a loopback request lost a
      # start-up race. The runner has two vCPUs and a thin memory margin, so a flaky check costs more
      # than a slow one.
      # Bounded so a hang fails naming this step instead of the job dying at the 200-minute limit.
      # Unchanged command, unchanged selection, unchanged coverage — only the trigger is now explicit.
      - name: Run complete Windows test suite serially
        if: steps.scope.outputs.mode == 'full'
        # 170, not 150. Still bounded, so a genuine hang fails naming this step rather than the job; the
        # margin over the measured 120–140 minutes is now large enough that variance cannot fake a red.
        timeout-minutes: 170
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -o pipefail
          cargo test --target x86_64-pc-windows-gnu --locked --all-targets -- --test-threads=1 2>&1 | tee windows-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Windows tests::The complete Windows all-targets suite failed"
            exit "$status"
          fi

      # Always, not only on failure. A green run is exactly when the suite's own summary is worth
      # keeping — it is the only place the test counts and warnings can be read back later, since the
      # logs expire in the UI. `warn` matters as much as `always`: setup can fail before the log exists,
      # and a missing log must never be able to turn a meaningful failure into a green job, nor turn an
      # unrelated missing file into a second failure. The steps above are still what decide the verdict;
      # this step only records.
      - name: Upload Windows test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ultranet-windows-test-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-test.log
          if-no-files-found: warn
          retention-days: 14
