name: Publish UltraNet node release

on:
  push:
    tags:
      - "v7.1.0"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v7.1.0

jobs:
  build-linux:
    name: Build Linux x64 node
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libclang-dev libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build UltraNet
        run: cargo build --release --locked --bin UltraNet

      - name: Package Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/UltraNet dist/package/UltraNetNode
          tar -C dist/package -czf dist/UltraNetNode-linux-x64.tar.gz UltraNetNode
          rm -rf dist/package

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-linux-x64
          path: dist/UltraNetNode-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS x64 node
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install LLVM for bindgen
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build UltraNet
        run: cargo build --release --locked --bin UltraNet

      - name: Package macOS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/UltraNet dist/package/UltraNetNode
          tar -C dist/package -czf dist/UltraNetNode-macos-x64.tar.gz UltraNetNode
          rm -rf dist/package

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-macos-x64
          path: dist/UltraNetNode-macos-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 node
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-llvm-libs
            mingw-w64-x86_64-cmake

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Verify Windows toolchain
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/msys64/mingw64/bin
        run: |
          test -f /mingw64/bin/libclang.dll
          cargo --version
          rustc --version
          clang --version
          ls -l /mingw64/bin/libclang.dll

      - name: Build UltraNet
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/msys64/mingw64/bin
        run: |
          set -o pipefail
          cargo build --target x86_64-pc-windows-gnu --release --locked --bin UltraNet 2>&1 | tee windows-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error(\\[E[0-9]+\\])?:|fatal error:" windows-build.log | tail -20 | while IFS= read -r line; do
              echo "::error title=Windows build::$line"
            done
            exit "$status"
          fi

      - name: Upload Windows build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-windows-build-log
          path: windows-build.log
          if-no-files-found: ignore

      - name: Package Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/UltraNet.exe dist/UltraNetNode.exe
          Compress-Archive -Path dist/UltraNetNode.exe -DestinationPath dist/UltraNetNode-windows-x64.zip -Force
          Remove-Item dist/UltraNetNode.exe

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-windows-x64
          path: dist/UltraNetNode-windows-x64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: UltraNetNode-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            UltraNetNode-linux-x64.tar.gz \
            UltraNetNode-macos-x64.tar.gz \
            UltraNetNode-windows-x64.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish UltraNet v7.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UltraNet ${{ env.RELEASE_TAG }} — Sovereign Node
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Public UltraNet v7.1.0 sovereign node packages.

            Archives:
            - `UltraNetNode-windows-x64.zip` contains `UltraNetNode.exe`.
            - `UltraNetNode-linux-x64.tar.gz` contains `UltraNetNode`.
            - `UltraNetNode-macos-x64.tar.gz` contains `UltraNetNode`.

            Verify an archive with `SHA256SUMS.txt` before executing it.
          files: |
            dist/UltraNetNode-linux-x64.tar.gz
            dist/UltraNetNode-macos-x64.tar.gz
            dist/UltraNetNode-windows-x64.zip
            dist/SHA256SUMS.txt
