name: Publish UltraNet node release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing semver tag to rebuild and publish"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-22.04
    steps:
      - name: Reject invalid release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::RELEASE_TAG must match vMAJOR.MINOR.PATCH; received ${RELEASE_TAG}"
            exit 1
          fi

      - name: Check out source for version consistency
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1

      - name: Verify website and documentation release version
        run: node scripts/check-release-version.mjs "${RELEASE_TAG}"

  build-linux:
    name: Build Linux x64 node
    needs: validate-release
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "120"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake libclang-dev libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ultranet-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ultranet-cargo-

      - name: Build UltraNet
        run: cargo build --release --locked --bin UltraNet

      - name: Package Linux archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/UltraNet dist/package/UltraNetNode
          tar -C dist/package -czf dist/UltraNetNode-linux-x64.tar.gz UltraNetNode
          rm -rf dist/package

      - name: Upload Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-linux-x64
          path: dist/UltraNetNode-linux-x64.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS x64 node
    needs: [validate-release, build-linux]
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "120"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install LLVM for bindgen
        run: |
          brew install llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ultranet-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ultranet-cargo-

      - name: Verify locked Aptos source is available
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          test -d "$HOME/.cargo/git/checkouts" || {
            echo "::error::Cargo Git cache is missing the locked Aptos checkout"
            exit 1
          }

      - name: Build UltraNet
        run: cargo build --release --locked --bin UltraNet

      - name: Package macOS archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/UltraNet dist/package/UltraNetNode
          tar -C dist/package -czf dist/UltraNetNode-macos-x64.tar.gz UltraNetNode
          rm -rf dist/package

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-macos-x64
          path: dist/UltraNetNode-macos-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 node
    needs: validate-release
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-llvm-libs
            mingw-w64-x86_64-cmake

      - name: Install native LLVM for bindgen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmPath = "C:\Program Files\LLVM\bin"
          if (!(Test-Path "$llvmPath\libclang.dll")) {
            throw "libclang.dll was not installed at $llvmPath"
          }
          "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Verify Windows toolchain
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          cargo --version
          rustc --version
          clang --version
          ls -l "/c/Program Files/LLVM/bin/libclang.dll"

      - name: Build UltraNet
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -o pipefail
          cargo build --target x86_64-pc-windows-gnu --release --locked --bin UltraNet 2>&1 | tee windows-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "error(\\[E[0-9]+\\])?:|fatal error:" windows-build.log | tail -20 | while IFS= read -r line; do
              echo "::error title=Windows build::$line"
            done
            exit "$status"
          fi

      - name: Upload Windows build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-windows-build-log
          path: windows-build.log
          if-no-files-found: ignore

      - name: Verify Windows configuration preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = "target/x86_64-pc-windows-gnu/release/UltraNet.exe"
          $env:ULTRANET_DB_PATH = Join-Path $env:RUNNER_TEMP "ultranet-config-check"
          $env:ULTRANET_PAUSE_ON_ERROR = "false"
          [Environment]::SetEnvironmentVariable("ULTRANET_ADMIN_TOKEN", $null, "Process")
          & $binary --check-config
          if ($LASTEXITCODE -eq 0) {
            throw "Missing ULTRANET_ADMIN_TOKEN unexpectedly passed configuration validation"
          }
          $env:ULTRANET_ADMIN_TOKEN = "a" * 64
          & $binary --check-config
          if ($LASTEXITCODE -ne 0) {
            throw "Valid ULTRANET_ADMIN_TOKEN failed configuration validation"
          }

      - name: Verify Windows FHE startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = "target/x86_64-pc-windows-gnu/release/UltraNet.exe"
          $env:ULTRANET_DB_PATH = Join-Path $env:RUNNER_TEMP "ultranet-fhe-check"
          $env:ULTRANET_PAUSE_ON_ERROR = "false"
          $env:ULTRANET_ADMIN_TOKEN = "a" * 64
          if (Test-Path $env:ULTRANET_DB_PATH) {
            Remove-Item -Recurse -Force $env:ULTRANET_DB_PATH
          }
          & $binary --check-fhe
          if ($LASTEXITCODE -ne 0) {
            throw "Windows FHE initialization failed with exit code $LASTEXITCODE"
          }
          Remove-Item -Recurse -Force $env:ULTRANET_DB_PATH

      - name: Verify Windows validator public-key export
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = "target/x86_64-pc-windows-gnu/release/UltraNet.exe"
          $dbPath = Join-Path $env:RUNNER_TEMP "ultranet-validator-export-check"
          $exportRoot = Join-Path $env:RUNNER_TEMP "ultranet-validator-export-output"
          $outputPath = Join-Path $exportRoot "DILITHIUM_PUB_KEY.hex"
          $env:ULTRANET_DB_PATH = $dbPath
          $env:ULTRANET_ADMIN_TOKEN = "a" * 64
          $env:ULTRANET_PAUSE_ON_ERROR = "false"
          New-Item -ItemType Directory -Force -Path $exportRoot | Out-Null
          & $binary "--export-validator-public-key" $outputPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows validator public-key export failed with exit code $LASTEXITCODE"
          }
          if (!(Test-Path -LiteralPath $outputPath)) {
            throw "Windows validator public-key export did not create DILITHIUM_PUB_KEY.hex"
          }
          $publicKey = (Get-Content -Raw -LiteralPath $outputPath).Trim()
          if ($publicKey.Length -ne 5184 -or $publicKey -cnotmatch '^[0-9a-f]{5184}$') {
            throw "Exported validator public key must be exactly 5,184 lowercase hexadecimal characters"
          }
          $firstHash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash
          $overwriteArgument = '"{0}"' -f $outputPath
          $overwriteProcess = Start-Process -FilePath $binary -ArgumentList @(
            "--export-validator-public-key",
            $overwriteArgument
          ) -Wait -PassThru -NoNewWindow
          if ($overwriteProcess.ExitCode -eq 0) {
            throw "Windows validator public-key export unexpectedly overwrote an existing output file"
          }
          $secondHash = (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash
          if ($firstHash -ne $secondHash) {
            throw "Windows validator public-key output changed after overwrite rejection"
          }
          Remove-Item -Recurse -Force -LiteralPath @($dbPath, $exportRoot)

      - name: Package Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/UltraNet.exe dist/package/UltraNetNode.exe
          Copy-Item release/windows/Start-UltraNetNode.bat dist/package/Start-UltraNetNode.bat
          Copy-Item release/windows/UltraNetNode.env.example dist/package/UltraNetNode.env.example
          Copy-Item release/windows/README-WINDOWS.txt dist/package/README-WINDOWS.txt
          Compress-Archive -Path dist/package/* -DestinationPath dist/UltraNetNode-windows-x64.zip -Force
          $extractPath = Join-Path $env:RUNNER_TEMP "ultranet-windows-package-check"
          Expand-Archive dist/UltraNetNode-windows-x64.zip -DestinationPath $extractPath -Force
          $members = @(Get-ChildItem $extractPath -File | Select-Object -ExpandProperty Name | Sort-Object)
          $expected = @("README-WINDOWS.txt", "Start-UltraNetNode.bat", "UltraNetNode.env.example", "UltraNetNode.exe")
          if ((Compare-Object $members $expected) -or $members.Count -ne $expected.Count) {
            throw "Windows archive members do not match the desktop package contract: $($members -join ', ')"
          }
          foreach ($member in $expected) {
            $memberPath = Join-Path $extractPath $member
            if (!(Test-Path $memberPath) -or (Get-Item $memberPath).Length -le 0) {
              throw "Windows archive member is missing or empty: $member"
            }
          }
          Remove-Item -Recurse -Force dist/package

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-windows-x64
          path: dist/UltraNetNode-windows-x64.zip
          if-no-files-found: error

  test-windows:
    name: Test Windows x64 in parallel
    needs: validate-release
    runs-on: windows-2022
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_NET_RETRY: "5"
      CARGO_HTTP_TIMEOUT: "120"
      GIT_TERMINAL_PROMPT: "0"
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-llvm-libs
            mingw-w64-x86_64-cmake

      - name: Install native LLVM for bindgen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install llvm -y --no-progress
          $llvmPath = "C:\Program Files\LLVM\bin"
          if (!(Test-Path "$llvmPath\libclang.dll")) {
            throw "libclang.dll was not installed at $llvmPath"
          }
          "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Restore Cargo dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ultranet-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ultranet-cargo-

      - name: Verify Windows test toolchain
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -euo pipefail
          test -f "/c/Program Files/LLVM/bin/libclang.dll"
          cargo --version
          rustc --version
          clang --version

      - name: Run complete Windows test suite with default parallelism
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: C:/Program Files/LLVM/bin
        run: |
          set -o pipefail
          cargo test --target x86_64-pc-windows-gnu --locked --all-targets 2>&1 | tee windows-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=Windows tests::The complete Windows all-targets suite failed"
            exit "$status"
          fi

      - name: Upload Windows test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: UltraNetNode-windows-test-log
          path: windows-test.log
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    needs: [build-linux, build-macos, build-windows, test-windows]
    runs-on: ubuntu-22.04
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: UltraNetNode-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            UltraNetNode-linux-x64.tar.gz \
            UltraNetNode-macos-x64.tar.gz \
            UltraNetNode-windows-x64.zip \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish UltraNet release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UltraNet ${{ env.RELEASE_TAG }} — Sovereign Node
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Public UltraNet ${{ env.RELEASE_TAG }} sovereign node packages.

            Archives:
            - `UltraNetNode-windows-x64.zip` contains `UltraNetNode.exe`, `Start-UltraNetNode.bat`, `UltraNetNode.env.example`, and `README-WINDOWS.txt`.
            - `UltraNetNode-linux-x64.tar.gz` contains `UltraNetNode`.
            - `UltraNetNode-macos-x64.tar.gz` contains `UltraNetNode`.

            Verify an archive with `SHA256SUMS.txt` before executing it.
          files: |
            dist/UltraNetNode-linux-x64.tar.gz
            dist/UltraNetNode-macos-x64.tar.gz
            dist/UltraNetNode-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Verify published asset contract
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actual=$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' | sort)
          expected=$(printf '%s\n' SHA256SUMS.txt UltraNetNode-linux-x64.tar.gz UltraNetNode-macos-x64.tar.gz UltraNetNode-windows-x64.zip | sort)
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Published assets do not match the release contract"
            diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") || true
            exit 1
          fi
